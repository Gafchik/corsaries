services:
  db:
    image: postgres:16-alpine
    container_name: corsaries_db
    ports:
      - "${DB_PORT_MAPPING:-127.0.0.1:5442:5432}"
    environment:
      - POSTGRES_DB=corsaries
      - POSTGRES_USER=corsaries
      - POSTGRES_PASSWORD=${DB_PASSWORD:-corsaries}
    volumes:
      - corsaries_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsaries -d corsaries"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: docker/php/Dockerfile
    container_name: corsaries_api
    volumes:
      - ./api:/var/www
    env_file:
      - ./api/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=corsaries
      - DB_USERNAME=corsaries
      - DB_PASSWORD=${DB_PASSWORD:-corsaries}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-nginx:
    image: nginx:stable-alpine
    container_name: corsaries_api_nginx
    ports:
      - "${API_PORT_MAPPING:-127.0.0.1:8090:80}"
    volumes:
      - ./api:/var/www
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

  realtime:
    build:
      context: ./realtime
    container_name: corsaries_realtime
    ports:
      - "${REALTIME_PORT_MAPPING:-127.0.0.1:2567:2567}"
    environment:
      - PORT=2567
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=corsaries
      - DB_USERNAME=corsaries
      - DB_PASSWORD=${DB_PASSWORD:-corsaries}
      - LARAVEL_API_URL=http://api-nginx/api
    volumes:
      - ./realtime:/app
      - corsaries_realtime_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      api-nginx:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: corsaries_web
    ports:
      - "${WEB_PORT_MAPPING:-127.0.0.1:9200:9200}"
    environment:
      - API_PROXY_TARGET=http://api-nginx:80
    volumes:
      - ./web:/app
      - corsaries_web_node_modules:/app/node_modules
    depends_on:
      - api-nginx
    restart: unless-stopped

volumes:
  corsaries_db_data:
  corsaries_web_node_modules:
  corsaries_realtime_node_modules:
