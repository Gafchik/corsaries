<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>">
    <!--
      connect-src is deliberately wide open (any http/ws origin) in dev —
      the API/realtime dev-proxy targets are reached by whatever host
      loaded the page (127.0.0.1, a LAN IP for phone testing, localhost),
      and a narrower allowlist there silently blocks the websocket connect,
      producing a white screen (uncaught promise rejection during
      WorldPage's mount — see git history for that exact bug).

      Production is scoped instead: without an explicit connect-src here,
      CSP falls back to default-src 'self', which covers the same-origin
      /api/ fetches fine but blocks the realtime connection outright — it's
      a different origin by port. Needs BOTH schemes for that host:port,
      not just wss:// — colyseus.js's Client does a plain https:// POST to
      /matchmake/joinOrCreate/:room first (to get a room + sessionId) and
      only opens the wss:// connection after, so wss:// alone here still
      let the initial fetch get silently CSP-blocked (surfaces in the
      browser as a bare "Failed to fetch", no server involved at all).
      Hardcoded to the one real production domain rather than derived from
      VITE_REALTIME_URL at build time, since Quasar's index.html template
      doesn't have that env var in scope here — update this by hand if the
      production realtime host/port ever changes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://t.me https://*.telesco.pe;<% if (ctx.dev) { %> connect-src 'self' ws: http:; worker-src 'self' blob:;<% } else { %> connect-src 'self' https://corsaries.slay-dev.space:2567 wss://corsaries.slay-dev.space:2567; worker-src 'self' blob:;<% } %>"
    />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
